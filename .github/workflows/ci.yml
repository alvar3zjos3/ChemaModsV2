name: CI

on:
  pull_request:
    paths:
      - src/**
      - cmake/**
      - CMakeLists.txt
      - .github/workflows/ci.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: windows-latest
    name: CI
    steps:
      - uses: actions/checkout@v4

      - name: Check CMake version
        run: cmake --version

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Generate CMake project
        run: cmake -D CMAKE_BUILD_TYPE=RelWithDebInfo -D OPTIMIZE=YES -S. -Bbuild -G Ninja

      - name: Build 64bit release DLL
        run: cmake --build ./build --config RelWithDebInfo --target ChemaModsV2 --

      - name: Check if DLL got built
        run: if (-Not (Test-Path -path "build/ChemaModsV2.dll")) {throw 1}

      - name: Rename DLL to ChemaModsV2-dev-{GITHUB_SHA}.dll
        run: |
          del ChemaModsV2-dev-*.dll
          del ChemaModsV2-dev-*.pdb
          ren ChemaModsV2.dll ChemaModsV2-dev-${{github.sha}}.dll
          ren ChemaModsV2.pdb ChemaModsV2.pdb
        working-directory: build/

      - name: Upload Artifact (dll)
        uses: actions/upload-artifact@v4
        with:
          name: binary
          path: |
            build/ChemaModsV2-dev-*.dll
      - name: Upload Artifact (pdb)
        uses: actions/upload-artifact@v4
        with:
          name: pdb
          path: |
            build/ChemaModsV2.pdb
