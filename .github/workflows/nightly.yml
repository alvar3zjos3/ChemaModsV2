name: Build Nightly

on:
  schedule:
    # Tarea programada que se ejecuta todos los días a las 14:00 UTC (2PM UTC)
    - cron: '0 14 * * *'
  workflow_dispatch:

# Permisos necesarios para eliminar la release y tag anterior
permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  check_recent_commit:
    runs-on: ubuntu-latest
    name: Verificar Commit Reciente
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - id: should_run
        name: Comprobar si el último commit es de las últimas 24 horas
        run: |
          if [ -z "$(git rev-list --since="24 hours ago" --all)" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  build_nightly:
    runs-on: windows-latest
    name: Build Nightly
    needs: check_recent_commit
    if: needs.check_recent_commit.outputs.should_run == 'true'
    outputs:
      full_sha: ${{ steps.var.outputs.full_sha }}
      short_sha: ${{ steps.var.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verificar versión de CMake
        run: cmake --version

      - name: Configurar entorno MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Generar proyecto CMake
        run: cmake -D CMAKE_BUILD_TYPE=RelWithDebInfo -D OPTIMIZE=YES -S. -Bbuild -G Ninja

      - name: Compilar DLL 64-bit Release
        run: cmake --build ./build --config RelWithDebInfo --target ChemaModsV2 --

      - name: Subir Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: binary
          path: |
            build/ChemaModsV2.dll
            build/ChemaModsV2.pdb

      - name: Generar información de compilación
        id: var
        run: |
          echo "full_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

  recreate_release:
    runs-on: ubuntu-latest
    name: Recrear Release
    needs: build_nightly
    if: needs.check_recent_commit.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Eliminar Release Existente
        id: delete_release
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = "nightly";
      
            const releases = await github.rest.repos.listReleases({
              owner: owner,
              repo: repo,
            });
      
            const release = releases.data.find(release => release.tag_name === tag);
      
            if (release) {
              await github.rest.repos.deleteRelease({
                owner: owner,
                repo: repo,
                release_id: release.id,
              });
              console.log(`Eliminada release con ID ${release.id}`);
            } else {
              console.log("No existe release para eliminar");
            }

            try {
              await github.rest.git.deleteRef({
                owner: owner,
                repo: repo,
                ref: `tags/${tag}`,
              });
              console.log(`Eliminada etiqueta ${tag}`);
            } catch (error) {
              console.error(`Error al eliminar la etiqueta: ${error.message}`);
            }

      - name: Descargar Artefacto
        uses: actions/download-artifact@v4
        with:
          name: binary

      - name: Mostrar SHA256 de la compilación
        id: build_sha
        run: |
          sha256sum ChemaModsV2.dll > sha256.checksum
          echo "build_sha=$(cat sha256.checksum)" >> $GITHUB_OUTPUT
          cat sha256.checksum

      - name: Release Nightly
        uses: softprops/action-gh-release@v1
        with:
          name: Nightly [${{ needs.build_nightly.outputs.short_sha }}]
          tag_name: nightly
          body: |
            **Esta release ha sido compilada por Github Actions**
            [Enlace a la compilación](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Build SHA256:
            ```
            ${{ steps.build_sha.outputs.build_sha }}
            ```
            Para verificar el SHA256 durante la acción, haz clic en el enlace de la compilación, ve a "Create Release", abre el paso **"Mostrar SHA256 de la compilación"** y lee el valor.

           Puedes descargar los artefactos de la compilación, generar un checksum SHA256 y compararlo con el que aparece abajo.
           **Los artefactos de la compilación NO son automáticamente iguales a los assets de la release**, ya que estos pueden ser modificados después.

            Estas son compilaciones nightly de **ChemaModsV2**, se proporcionan **únicamente con fines de prueba**:
            - Probar si tu entorno de compilación produce un `ChemaModsV2.dll` roto
            - Probar si el código fuente está desactualizado y ya no es compatible con la versión actual de GTA V
            
            Si deseas usar este menú tal cual, lo haces **bajo tu propia responsabilidad**, no se ofrece ninguna garantía.

           Hash completo del commit:
            ```
            ${{ needs.build_nightly.outputs.full_sha }}
            ```
          files: |
            ChemaModsV2.dll
